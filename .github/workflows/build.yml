name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          mv lib lib_backup
          flutter create . --project-name mohasb_soft --platforms android
          rm -rf lib
          mv lib_backup lib
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Mohasb-Soft-APK
          path: build/app/outputs/flutter-apk/app-release.apk
